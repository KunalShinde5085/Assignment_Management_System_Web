<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Assignment Repository</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand"><span class="mark">AR</span><span>Assignment Repository</span></div>
      <div class="card">
        <h1>Create an account</h1>
        <p class="subtitle">Your account will need administrator approval before you can access the repository.</p>

        <div id="register-error" class="form-error-banner hidden"></div>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <div class="hint">At least 8 characters.</div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
      </div>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { initRegisterPage } from "./js/auth.js";
    initRegisterPage();
  </script>
</body>
</html>
