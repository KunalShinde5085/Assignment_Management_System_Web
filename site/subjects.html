<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — Assignment Repository</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="app-nav"></div>

  <main class="app-main">

        <div><h1>Subjects</h1><p class="subtitle">Browse subjects and their assignments</p></div>

      <div id="subjects-grid"></div>
    </div>

    <div id="subject-detail-view" class="hidden"></div>

  <script type="module" src="js/subjects.js"></script>

</html>
